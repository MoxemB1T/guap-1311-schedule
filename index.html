<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f5bd7" />
    <title>Расписание 1311</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">ГУАП · группа 1311</p>
        <h1>Расписание</h1>
      </div>
      <button id="adminOpen" class="icon-button" aria-label="Админ-панель">⚙</button>
    </header>

    <main>
      <section id="subgroupPrompt" class="welcome hidden">
        <span class="welcome-icon">👋</span>
        <h2>Какая у тебя подгруппа?</h2>
        <p>Покажем только твои занятия с разделением на подгруппы.</p>
        <div class="choice-row">
          <button data-subgroup="1" class="choice blue">Подгруппа 1</button>
          <button data-subgroup="2" class="choice red">Подгруппа 2</button>
        </div>
        <button data-subgroup="0" class="link-button">Не знаю / показывать всё</button>
      </section>

      <section id="scheduleView" class="hidden">
        <div class="schedule-intro"><b>Ближайшие две недели</b><span>Занятия с учётом вашей подгруппы</span></div>
        <div id="lessons" class="lessons"></div>
      </section>
    </main>

    <dialog id="adminDialog">
      <div class="dialog-head"><h2>Админ-панель</h2><button class="close-dialog">×</button></div>
      <div id="loginBox">
        <p>Проверяем права администратора через Telegram…</p>
      </div>
      <div id="editorBox" class="hidden">
        <p class="muted">Изменения публикуются сразу для всех пользователей.</p>
        <label class="week-choice">Текущая неделя<select id="weekSetting"><option value="blue">Синяя</option><option value="red">Красная</option></select></label>
        <div class="editor-actions"><button id="saveWeek" class="secondary">Сохранить неделю</button><button id="addLesson" class="primary">+ Добавить занятие</button><button id="logout" class="secondary">Выйти</button></div>
        <div id="adminLessons"></div>
      </div>
    </dialog>
    <dialog id="lessonDialog">
      <div class="dialog-head"><h2 id="lessonDialogTitle">Занятие</h2><button class="close-lesson">×</button></div>
      <form id="lessonForm" class="stack">
        <label>День недели<select name="day" required><option value="1">Понедельник</option><option value="2">Вторник</option><option value="3">Среда</option><option value="4">Четверг</option><option value="5">Пятница</option><option value="6">Суббота</option></select></label>
        <label>Пара<select name="pair" required><option value="1">1 (09:30–11:00)</option><option value="2">2 (11:10–12:40)</option><option value="3">3 (13:00–14:30)</option><option value="4">4 (15:10–16:40)</option><option value="5">5 (17:00–18:30)</option><option value="6">6 (18:40–20:10)</option></select></label>
        <label>Подгруппа<select name="subgroup"><option value="0">Общее занятие</option><option value="1">Подгруппа 1 (синяя)</option><option value="2">Подгруппа 2 (красная)</option></select></label>
        <label>Неделя<select name="week"><option value="0">Каждую неделю</option><option value="1">Синяя неделя</option><option value="2">Красная неделя</option></select></label>
        <label>Тип занятия<input name="type" placeholder="Лекция / лабораторная" required /></label>
        <label>Название<input name="title" required /></label>
        <label>Аудитория<input name="room" placeholder="12-06" required /></label>
        <label>Преподаватель<input name="teacher" required /></label>
        <div class="editor-actions"><button class="primary">Сохранить</button><button type="button" id="deleteLesson" class="danger">Удалить</button></div>
      </form>
    </dialog>
    <script src="config.js"></script>
    <script src="schedule.js"></script>
    <script src="app.js"></script>
  </body>
</html>
